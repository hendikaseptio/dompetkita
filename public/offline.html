<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline - DompetKita</title>
        <style>
            :root {
                --bg: #09090b;
                --card-bg: #18181b;
                --text-main: #f4f4f5;
                --text-muted: #a1a1aa;
                --border: #27272a;
                --primary: #10b981;
                --primary-hover: #059669;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f8fafc;
                    --card-bg: #ffffff;
                    --text-main: #0f172a;
                    --text-muted: #64748b;
                    --border: #e2e8f0;
                    --primary: #10b981;
                    --primary-hover: #059669;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
            }

            body {
                background-color: var(--bg);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }

            .container {
                max-width: 420px;
                width: 100%;
                background-color: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 1.5rem;
                padding: 2.5rem 2rem;
                text-align: center;
                box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.2),
                    0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }

            .icon-box {
                width: 72px;
                height: 72px;
                border-radius: 1.25rem;
                background: linear-gradient(
                    135deg,
                    rgba(16, 185, 129, 0.15),
                    rgba(16, 185, 129, 0.05)
                );
                border: 1px solid rgba(16, 185, 129, 0.25);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 1.5rem;
                color: var(--primary);
            }

            .icon-box svg {
                width: 36px;
                height: 36px;
            }

            h1 {
                font-size: 1.35rem;
                font-weight: 700;
                margin-bottom: 0.6rem;
                letter-spacing: -0.02em;
            }

            p {
                font-size: 0.925rem;
                color: var(--text-muted);
                line-height: 1.5;
                margin-bottom: 2rem;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                width: 100%;
                padding: 0.85rem 1.25rem;
                font-size: 0.95rem;
                font-weight: 600;
                border-radius: 0.875rem;
                border: none;
                background-color: var(--primary);
                color: #ffffff;
                cursor: pointer;
                transition: all 0.2s ease;
                text-decoration: none;
            }

            .btn:hover {
                background-color: var(--primary-hover);
                transform: translateY(-1px);
            }

            .btn:active {
                transform: translateY(0);
            }

            .status-pill {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                font-size: 0.75rem;
                padding: 0.25rem 0.75rem;
                border-radius: 9999px;
                background: rgba(239, 68, 68, 0.12);
                color: #ef4444;
                margin-bottom: 1rem;
                font-weight: 500;
            }

            .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background-color: #ef4444;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="status-pill">
                <span class="status-dot"></span>
                Mode Offline
            </div>
            <div class="icon-box">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 3l18 18M10.5 10.5a3 3 0 014.24 4.24M6.34 6.34A10.97 10.97 0 001.5 12a10.97 10.97 0 0019.09 5.66M8.53 8.53A6.97 6.97 0 005.12 12a6.97 6.97 0 0011.83 3.47"
                    />
                </svg>
            </div>
            <h1>Tidak Ada Koneksi Internet</h1>
            <p>
                DompetKita membutuhkan koneksi internet untuk menyinkronkan data
                keuangan keluarga Anda. Sambungkan kembali ke Wi-Fi atau data
                seluler.
            </p>
            <button class="btn" onclick="window.location.reload()">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                </svg>
                Coba Muat Ulang
            </button>
        </div>

        <script>
            window.addEventListener('online', function () {
                window.location.reload();
            });
        </script>
    </body>
</html>
